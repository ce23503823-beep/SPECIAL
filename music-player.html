```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Love ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #170b20;
            color: white;
            font-family: Arial, sans-serif;
        }

        #musicControls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
        }

        #musicButton {
            padding: 10px 16px;
            border: none;
            border-radius: 25px;
            background: #ff5caa;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #status {
            font-size: 12px;
            text-align: center;
            padding: 5px;
        }

        #pageFrame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <div id="musicControls">
        <button id="musicButton" type="button">
            🎵 Play Music
        </button>
        <div id="status">Our Love ❤️</div>
    </div>

    <!-- One music player for all pages -->
    <audio id="bgMusic" loop controls>
  <source src="Anbil%20Avan.mp3" type="audio/mpeg">
</audio>

    <!-- All pages open inside this iframe -->
    <iframe id="pageFrame" src="index.html" title="Our Love Pages"></iframe>

    <script>
        const music = document.getElementById("bgMusic");
        const musicButton = document.getElementById("musicButton");
        const status = document.getElementById("status");
        const pageFrame = document.getElementById("pageFrame");

        async function playMusic() {
            try {
                await music.play();

                musicButton.textContent = "🎵 Pause Music";
                status.textContent = "Music Playing ❤️";
            } catch (error) {
                musicButton.textContent = "🎵 Play Music";
                status.textContent = "Click Play Music to start ❤️";
                console.error("Music playback failed:", error);
            }
        }

        musicButton.addEventListener("click", function () {
            if (music.paused) {
                playMusic();
            } else {
                music.pause();
                musicButton.textContent = "🎵 Play Music";
                status.textContent = "Music Paused";
            }
        });

        // Receive page navigation requests from the iframe
        window.addEventListener("message", function (event) {
            // Only accept messages from this same website
            if (event.origin !== window.location.origin) {
                return;
            }

            if (typeof event.data !== "string") {
                return;
            }

            const pages = {
                letter: "letter.html",
                quiz: "quiz.html",
                surprise: "surprise.html"
            };

            if (pages[event.data]) {
                pageFrame.src = pages[event.data];
            }

            if (event.data === "toggleMusic") {
                if (music.paused) {
                    playMusic();
                } else {
                    music.pause();
                    musicButton.textContent = "🎵 Play Music";
                    status.textContent = "Music Paused";
                }
            }
        });

        music.addEventListener("error", function () {
            status.textContent = "Song not found! Check filename.";
        });
    </script>

</body>
</html>
