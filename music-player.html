<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #170b20;
            color: white;
            font-family: Arial, sans-serif;
        }

        #musicControls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
        }

        #musicButton {
            padding: 10px 16px;
            border: none;
            border-radius: 25px;
            background: #ff5caa;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #status {
            font-size: 12px;
            text-align: center;
            padding: 5px;
        }

        #pageFrame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <div id="musicControls">
        <button id="musicButton">🎵 Play Music</button>
        <div id="status">Our Love ❤️</div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="../music/Anbil%20Avan.mp3" type="audio/mpeg">
    </audio>

    <iframe id="pageFrame" src="index.html"></iframe>

    <script>
        const music = document.getElementById("bgMusic");
        const musicButton = document.getElementById("musicButton");
        const status = document.getElementById("status");
        const pageFrame = document.getElementById("pageFrame");

        async function playMusic() {
            try {
                await music.play();
                musicButton.textContent = "🎵 Pause Music";
                status.textContent = "Music Playing ❤️";
            } catch (error) {
                status.textContent = "Music blocked! Click Play Music.";
                console.error(error);
            }
        }

        musicButton.addEventListener("click", () => {
            if (music.paused) {
                playMusic();
            } else {
                music.pause();
                musicButton.textContent = "🎵 Play Music";
                status.textContent = "Music Paused";
            }
        });

        window.addEventListener("message", (event) => {

            // Accept messages only from this same website.
    

            const pages = {
                letter: "letter.html",
                quiz: "quiz.html",
                surprise: "surprise.html"
            };

            if (typeof event.data !== "string") {
                return;
            }

            if (pages[event.data]) {
                pageFrame.src = pages[event.data];
            }

            if (event.data === "toggleMusic") {
                if (music.paused) {
                    playMusic();
                } else {
                    music.pause();
                    musicButton.textContent = "🎵 Play Music";
                    status.textContent = "Music Paused";
                }
            }
        });

        music.addEventListener("error", () => {
            status.textContent = "Song not found! Check music folder.";
        });
    </script>

</body>
</html>
